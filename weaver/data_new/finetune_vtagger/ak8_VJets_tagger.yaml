### use `&`, `|`, `~` for logical operations on numpy arrays
### can use functions from `math`, `np` (numpy), and `ak` in the expression

## Note: if it's a higgs then it has to be matched (note: fj_genRes_mass=125 for higgs else 0)
selection: >-
   (fj_msoftdrop > 40)

### selection to apply at test time (i.e., when running w/ --predict)
test_time_selection: >-
   (fj_msoftdrop > 40)

new_variables:
   ### [format] name: formula
   ### can use functions from `math`, `np` (numpy), and `ak` in the expression

   class_Wplus:  (fj_isWplus_Matched == 1)
   class_Wminus: (fj_isWminus_Matched == 1)
   class_Z:      (fj_isZ_Matched == 1)
   class_QCD:    (fj_isQCD_Matched == 1)


preprocess:
   ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
   ### [note]: `[var]_mask` will not be transformed even if `method=auto`
   method: manual
   ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
   data_fraction:

# it clips from -5 to 5 by default [minus, multiplies, clip min, clip max]: +1 then take log()
inputs:
   basic:
      length: null
      vars:
         - fj_pt
         - fj_msoftdrop
         # - fj_eta
         # - fj_phi

labels:
   ### type can be `simple`, `custom`
   ### [option 1] use `simple` for binary/multi-class classification, then `value` is a list of 0-1 labels
   type: simple
   value: [class_Wplus, class_Wminus, class_Z, class_QCD]

   ### [option 2] otherwise use `custom` to define the label, then `value` is a map
   # type: custom
   # value:
   # target_mass: np.where(fj_isQCD, fj_genjet_sdmass, fj_gen_mass)

observers:
   - fj_pt
   - fj_msoftdrop
   - fj_eta
   - fj_phi
   - class_Wplus
   - class_Wminus
   - class_Z
   - class_QCD
   - fj_ParT_mass
   - fj_ParT_score

weights:
   ### [option 1] use precomputed weights stored in the input files
   # use_precomputed_weights: true
   # weight_branches: [weight, class_weight]
   ### [option 2] compute weights on-the-fly using reweighting histograms
   use_precomputed_weights: false
   reweight_discard_under_overflow: false
   reweight_method: flat

   reweight_vars:
      # fj_pt: [200, 300, 400, 600, 2500]
      fj_pt: [200, 2500]
      fj_msoftdrop: [-10000, 10000]
   reweight_classes: [class_Wplus, class_Wminus, class_Z, class_QCD]
   class_weights: [1, 1, 1, 1]
   reweight_hists:
