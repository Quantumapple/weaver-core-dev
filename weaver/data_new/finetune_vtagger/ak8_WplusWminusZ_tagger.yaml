   use_precomputed_weights: false
   reweight_discard_under_overflow: false
   reweight_method: flat

   reweight_vars:
      fj_pt: [200, 2500]
      fj_msoftdrop: [-10000, 10000]
   reweight_classes: [label_Wplus, label_Wminus, label_Z]
   class_weights: [1, 1, 1]
