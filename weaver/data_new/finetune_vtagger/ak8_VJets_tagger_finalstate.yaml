### use `&`, `|`, `~` for logical operations on numpy arrays
### can use functions from `math`, `np` (numpy), and `ak` in the expression

### run_32_finalstate_split: same Step 2 (MLP head on frozen GloParT hidden-neuron embeddings) as
### ak8_VJets_tagger.yaml, but the 4-way boson-identity target (Wplus/Wminus/Z/QCD) is replaced by a
### 12-way final-state-content target, split-and-recombine style:
###   Wplus  -> Wplus_ud, Wplus_cs
###   Wminus -> Wminus_ud, Wminus_cs
###   Z      -> Z_bb, Z_cc, Z_qq
###   QCD    -> QCD_b, QCD_bb, QCD_c, QCD_cc, QCD_other
### Motivation (see run_outputs/31_wz_confusion_error_analysis/experiments.md): Z's dominant
### confusion is with Wplus/Wminus, not QCD, inside the true mass window -- plausibly because Z's
### mixed heavy-flavor content (bb/cc) vs. W's light-quark-only content isn't being exploited by the
### flat 4-way label. Training on the finer final-state split forces the loss to separate e.g. Z_bb
### from Z_qq explicitly; at analysis time the 12 sub-class softmax scores are summed back into the
### original 4 boson-identity groups for an apples-to-apples recall/AUC comparison against 18-30,
### while the raw 12-way scores are also kept for their own diagnostic value.
###
### fj_isWplus_ud/fj_isWplus_cs/... are raw observer columns already present in the Step 1 hidden-
### neuron extraction output (ak8_VJets_hidneuron_extraction.yaml) -- confirmed present in existing
### extraction output, so no re-extraction (re-running the 256-hidNeuron --predict step) is needed.

### label_Wplus/label_Wminus/label_Z/label_QCD are real columns in the extraction output (not derived
### here): weaver's variable-name resolver excludes underscore-prefixed identifiers, so `_label_` can
### never be referenced in a new_variables expression -- these booleans must already exist as raw
### columns (see ak8_VJets_hidneuron_extraction.yaml's observers).

### selection: drops the Cabibbo-suppressed cross-generation W decays (W+->us~/cd~, W-->u~s/d~c),
### i.e. jets with label_Wplus==1 or label_Wminus==1 but matching neither _ud nor _cs. Measured rate:
### 5.10% of Wplus, 5.04% of Wminus (Z and QCD are 0% unmatched -- Z_qq/QCD_other already cover
### everything). This rate matches sin^2(Cabibbo angle) ~ 4.9%, confirming these are a real but
### low-stats physics sub-channel, not a matching failure. Rather than adding Wplus_cross/
### Wminus_cross as a 13th/14th trained class (which would still receive gradient from CrossEntropy
### and isn't worth a dedicated output neuron at ~5% stats), these rows are filtered out here so the
### model only ever sees the 12 well-populated final-state classes, and every surviving row is
### guaranteed to match exactly one of them (fixes weaver's "not assigned to any class" error).
selection: >-
    ~(
        ((label_Wplus == 1) & (fj_isWplus_ud != 1) & (fj_isWplus_cs != 1)) |
        ((label_Wminus == 1) & (fj_isWminus_ud != 1) & (fj_isWminus_cs != 1))
    )

preprocess:
   ### method: [manual, auto] - whether to use manually specified parameters for variable standardization
   ### auto: this MLP is trained from scratch on our own embeddings, so standardize from our own data
   ### rather than reusing manual constants (there's no external pretrained scale to match here).
   method: auto
   ### data_fraction: fraction of events to use when calculating the mean/scale for the standardization
   data_fraction: 0.2

